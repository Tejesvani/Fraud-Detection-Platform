apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-service
  namespace: fraud-detection
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alert-service
  template:
    metadata:
      labels:
        app: alert-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8002"
    spec:
      containers:
        - name: alert-service
          image: ghcr.io/tejesvani/fraud-detection-platform/alert-service:latest
          ports:
            - containerPort: 8002
              name: metrics
          envFrom:
            - configMapRef:
                name: fraud-detection-config
            - secretRef:
                name: fraud-detection-secrets
          readinessProbe:
            httpGet:
              path: /metrics
              port: 8002
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /metrics
              port: 8002
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 256Mi
              cpu: 250m
---
apiVersion: v1
kind: Service
metadata:
  name: alert-service
  namespace: fraud-detection
spec:
  selector:
    app: alert-service
  ports:
    - port: 8002
      targetPort: 8002
      name: metrics
