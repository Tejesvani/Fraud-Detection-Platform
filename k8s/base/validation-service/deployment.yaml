apiVersion: apps/v1
kind: Deployment
metadata:
  name: validation-service
  namespace: fraud-detection
spec:
  replicas: 1
  selector:
    matchLabels:
      app: validation-service
  template:
    metadata:
      labels:
        app: validation-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8004"
    spec:
      containers:
        - name: validation-service
          image: ghcr.io/tejesvani/fraud-detection-platform/validation-service:latest
          ports:
            - containerPort: 8004
              name: metrics
          envFrom:
            - configMapRef:
                name: fraud-detection-config
            - secretRef:
                name: fraud-detection-secrets
          readinessProbe:
            httpGet:
              path: /metrics
              port: 8004
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /metrics
              port: 8004
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 256Mi
              cpu: 250m
---
apiVersion: v1
kind: Service
metadata:
  name: validation-service
  namespace: fraud-detection
spec:
  selector:
    app: validation-service
  ports:
    - port: 8004
      targetPort: 8004
      name: metrics
