apiVersion: apps/v1
kind: Deployment
metadata:
  name: persistence-service
  namespace: fraud-detection
spec:
  replicas: 1
  selector:
    matchLabels:
      app: persistence-service
  template:
    metadata:
      labels:
        app: persistence-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8003"
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: persistence-service
          image: ghcr.io/tejesvani/fraud-detection-platform/persistence-service:latest
          ports:
            - containerPort: 8003
              name: metrics
          envFrom:
            - configMapRef:
                name: fraud-detection-config
            - secretRef:
                name: fraud-detection-secrets
          readinessProbe:
            httpGet:
              path: /metrics
              port: 8003
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /metrics
              port: 8003
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 256Mi
              cpu: 200m
---
apiVersion: v1
kind: Service
metadata:
  name: persistence-service
  namespace: fraud-detection
spec:
  selector:
    app: persistence-service
  ports:
    - port: 8003
      targetPort: 8003
      name: metrics
