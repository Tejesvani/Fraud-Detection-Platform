apiVersion: apps/v1
kind: Deployment
metadata:
  name: transaction-streamer
  namespace: fraud-detection
spec:
  replicas: 1
  selector:
    matchLabels:
      app: transaction-streamer
  template:
    metadata:
      labels:
        app: transaction-streamer
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: transaction-streamer
          image: ghcr.io/tejesvani/fraud-detection-platform/transaction-streamer:latest
          ports:
            - containerPort: 8000
              name: metrics
          envFrom:
            - configMapRef:
                name: fraud-detection-config
            - secretRef:
                name: fraud-detection-secrets
          readinessProbe:
            httpGet:
              path: /metrics
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /metrics
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 256Mi
              cpu: 200m
---
apiVersion: v1
kind: Service
metadata:
  name: transaction-streamer
  namespace: fraud-detection
spec:
  selector:
    app: transaction-streamer
  ports:
    - port: 8000
      targetPort: 8000
      name: metrics
