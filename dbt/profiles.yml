fraud_detection:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | int }}"
      user: "{{ env_var('POSTGRES_USER', 'fraud_user') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', 'fraud_password') }}"
      dbname: "{{ env_var('POSTGRES_DB', 'fraud_detection_db') }}"
      schema: analytics
      threads: 4
